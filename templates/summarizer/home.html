<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Summarizer Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-10">

    <div class="max-w-3xl mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-2xl font-bold mb-4">Upload PDF, Word, MP4 or YouTube URLs</h2>
        <form id="uploadForm" enctype="multipart/form-data" class="mb-4" method="POST">
            {% csrf_token %}
            <input type="file" name="files" multiple class="mb-4 border p-2 w-full">
            <textarea name="youtube_urls" placeholder="Enter YouTube URLs, one per line"
                class="mb-4 border p-2 w-full h-24"></textarea>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Submit</button>
        </form>
    </div>
</body>

</html>
